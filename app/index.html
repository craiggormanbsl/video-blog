<!doctype html>
<html lang="en"> 
<head> 
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Video Podcast</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Video Podcast">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, noimageindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="artwork.jpg">
<link rel="icon" href="artwork.jpg">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #000; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; min-width: 0; overflow: hidden; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  #app.hub-view #playerbar, #app.hub-view #stage, #app.hub-view #now, #app.hub-view #controls, #app.hub-view #list { display: none; }
  #app.player-view #hub { display: none; }
  #hub { flex: 1 1 auto; min-height: 0; background: #0a0a0a; display: flex; flex-direction: column; overflow: hidden; }
  #hub-title { flex: 0 0 auto; height: 44px; padding: 0 14px; display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; white-space: nowrap; background: #000; border-bottom: 1px solid #111; }
  #hub-title img, #hub-title p { display: none; }
  #hub-title h1 { margin: 0; min-width: 0; color: #d7d7d7; font-size: 15px; line-height: 1; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: clip; }
  #blogs { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 22px; overflow-x: hidden; overflow-y: auto; padding: 34px 18px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  #blogs button { width: min(100%, 320px); border: 0; border-radius: 0; padding: 0; background: transparent; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; cursor: pointer; }
  #blogs button.active { color: #fff; }
  #blogs img { width: min(68vw, 220px); max-width: 100%; aspect-ratio: 1; height: auto; border-radius: 12px; object-fit: cover; box-shadow: 0 18px 48px rgba(0,0,0,.38); }
  #blogs .blog-name { display: block; max-width: 100%; font-size: 20px; line-height: 1.2; font-weight: 700; overflow-wrap: anywhere; }
  #playerbar { flex: 0 0 auto; height: 42px; display: flex; align-items: center; gap: 4px; padding: 0 6px; background: #000; border-bottom: 1px solid #070707; overflow: hidden; white-space: nowrap; }
  #back-to-hub { flex: 0 0 auto; max-width: 78px; height: 36px; border: 0; border-radius: 8px; padding: 0 7px 0 2px; background: transparent; color: #0a84ff; font: inherit; font-size: 17px; display: inline-flex; align-items: center; gap: 1px; overflow: hidden; white-space: nowrap; cursor: pointer; }
  #back-to-hub:active { background: rgba(10,132,255,.12); }
  #back-to-hub span:first-child { flex: 0 0 auto; font-size: 30px; line-height: 1; margin-top: -2px; }
  #back-to-hub span:last-child { min-width: 0; overflow: hidden; text-overflow: clip; }
  #player-title { flex: 1 1 auto; min-width: 0; text-align: center; margin-right: 52px; color: #aaa; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: clip; }
  #stage { position: relative; flex: 0 0 auto; height: min(34dvh, 56.25vw); min-height: 120px; background: #000; cursor: pointer; user-select: none; -webkit-user-select: none; }
  #stage video { width: 100%; height: 100%; object-fit: contain; display: block; }
  #badge { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; transition: opacity .2s; }
  #badge span { width: 56px; height: 56px; border-radius: 50%; background: rgba(0,0,0,.55); display: grid; place-items: center; font-size: 24px; padding-left: 4px; }
  #stage.playing #badge { opacity: 0; }
  #now { flex: 0 0 auto; padding: 8px 14px 0; font-size: 14px; font-weight: 600; background: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #controls { flex: 0 0 auto; background: #111; border-bottom: 1px solid #222; padding: 2px 12px 6px; }
  #seek { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #9a9a9a; font-variant-numeric: tabular-nums; }
  #seek span { flex: 0 0 auto; min-width: 38px; }
  #seek span:last-child { text-align: right; }
  #seek input { flex: 1 1 auto; min-width: 0; height: 28px; margin: 0; accent-color: #4da3ff; }
  #buttons { display: flex; align-items: center; justify-content: center; gap: 14px; }
  #buttons button { width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: #fff; display: grid; place-items: center; cursor: pointer; }
  #buttons button:active { background: rgba(255,255,255,.15); }
  #buttons button:disabled { opacity: .35; }
  #buttons svg { width: 28px; height: 28px; fill: currentColor; }
  #buttons #toggle { width: 54px; height: 54px; background: #fff; color: #000; }
  #buttons #toggle:active { background: #ddd; }
  #buttons #toggle svg { width: 30px; height: 30px; }
  #buttons #toggle .i-pause, #controls.playing #toggle .i-play { display: none; }
  #controls.playing #toggle .i-pause { display: inline; }
  #list { flex: 1 1 auto; min-height: 0; margin: 0; padding: 0; list-style: none; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; background: #0b0b0b; }
  #list li { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid #1c1c1c; cursor: pointer; }
  #list li.active { background: #162536; }
  #list li:focus { outline: 2px solid #58a6ff; outline-offset: -2px; }
  #list img { width: 28px; height: 28px; border-radius: 5px; object-fit: cover; flex: 0 0 auto; }
  #list .name { flex: 1 1 auto; min-width: 0; font-size: 14px; line-height: 1.25; }
  #list .num { color: #8a8a8a; margin-right: 6px; }
  #list button { flex: 0 0 auto; width: 36px; height: 36px; border: 0; border-radius: 50%; background: #1f6feb; color: #fff; font-size: 14px; cursor: pointer; }
  #list li.playing button { background: #2ea043; }
</style>
</head>
<body>
<div id="app" class="hub-view">
  <section id="hub" aria-label="Video blogs">
    <div id="hub-title">
      <img id="hub-art" src="artwork.jpg" alt="">
      <div>
          <h1 id="hub-name">Video Library</h1>
        <p id="hub-desc">SharePoint-backed RSS video feeds</p>
      </div>
    </div>
    <div id="blogs" role="list"></div>
  </section>
  <header id="playerbar">
    <button id="back-to-hub" type="button" aria-label="Back to video blogs"><span aria-hidden="true">&#8249;</span><span>Back</span></button>
    <div id="player-title"></div>
  </header>
  <div id="stage" title="Tap to play or pause">
    <video id="video" playsinline webkit-playsinline preload="metadata"></video>
    <div id="badge"><span>&#9654;</span></div>
  </div>
  <div id="now"></div>
  <div id="controls">
    <div id="seek">
      <span id="elapsed">0:00</span>
      <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
      <span id="remaining">-0:00</span>
    </div>
    <div id="buttons">
      <button id="prev" type="button" aria-label="Previous chapter"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button id="back" type="button" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.5" text-anchor="middle" font-size="7" font-weight="700">10</text></svg></button>
      <button id="toggle" type="button" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path class="i-play" d="M8 5v14l11-7z"/><path class="i-pause" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button>
      <button id="fwd" type="button" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24"><path transform="translate(24 0) scale(-1 1)" d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.5" text-anchor="middle" font-size="7" font-weight="700">10</text></svg></button>
      <button id="next" type="button" aria-label="Next chapter"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
  </div>
  <ul id="list"></ul>
</div>
<script>
(() => {
  const KEY = `video-podcast-player-v1:${location.pathname}`;
  const show = { title: 'Video Podcast', author: '', artwork: 'artwork.jpg' };
  const app = document.getElementById('app');
  const video = document.getElementById('video');
  const stage = document.getElementById('stage');
  const list = document.getElementById('list');
  const blogsList = document.getElementById('blogs');
  const playerTitle = document.getElementById('player-title');
  const hubName = document.getElementById('hub-name');
  const hubDesc = document.getElementById('hub-desc');
  const hubArt = document.getElementById('hub-art');
  const now = document.getElementById('now');
  const controls = document.getElementById('controls');
  const scrub = document.getElementById('scrub');
  const elapsed = document.getElementById('elapsed');
  const remaining = document.getElementById('remaining');
  let scrubbing = false;

  const fmt = (s) => {
    s = Math.max(0, Math.floor(s || 0));
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = String(s % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
  };
  const togglePlay = () => { video.paused ? video.play().catch(() => {}) : video.pause(); };
  const skip = (delta) => {
    if (!video.duration) return;
    video.currentTime = Math.min(video.duration, Math.max(0, video.currentTime + delta));
  };
  const updateTime = () => {
    const d = video.duration || 0;
    elapsed.textContent = fmt(video.currentTime);
    remaining.textContent = '-' + fmt(d - video.currentTime);
    if (!scrubbing) scrub.value = d ? video.currentTime / d * 1000 : 0;
  };
  let episodes = [];
  let blogs = [];
  let activeBlog = 0;
  let state = { blog: 0, index: 0, browseIndex: 0, times: {}, view: 'hub' };
  let lastSave = 0;

  try { Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

  function episodeKey(ep) {
    return `${blogs[activeBlog]?.episodes || 'episodes.json'}:${ep.file}`;
  }

  function rememberCurrentTime() {
    if (episodes[state.index] && video.src && !video.ended) state.times[episodeKey(episodes[state.index])] = video.currentTime;
  }

  function browse(i, focusRow = false) {
    if (i < 0 || i >= episodes.length) return;
    state.browseIndex = i;
    mark();
    save();
    const row = list.children[i];
    row?.scrollIntoView({ block: 'nearest' });
    if (focusRow) row?.focus({ preventScroll: true });
  }

  function showHub() {
    rememberCurrentTime();
    video.pause();
    app.className = 'hub-view';
    state.view = 'hub';
    save();
  }

  function showPlayer() {
    app.className = 'player-view';
    state.view = 'player';
    state.blog = activeBlog;
    save();
  }

  function applyShowMetadata(metadata) {
    Object.assign(show, metadata || {});
    document.title = show.title;
    hubName.textContent = 'Video Library';
    hubDesc.textContent = show.description || 'SharePoint-backed RSS video feeds';
    hubArt.src = show.artwork || 'artwork.jpg';
    document.querySelector('meta[name="apple-mobile-web-app-title"]')?.setAttribute('content', show.title);
  }

  function renderBlogs() {
    blogsList.innerHTML = '';
    blogs.forEach((blog, i) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = i === activeBlog ? 'active' : '';
      button.setAttribute('role', 'listitem');
      button.setAttribute('aria-label', 'Open ' + blog.title);
      const img = Object.assign(document.createElement('img'), { src: blog.artwork || show.artwork, alt: '', loading: 'lazy' });
      const label = document.createElement('span');
      label.className = 'blog-name';
      label.textContent = blog.title;
      button.append(img, label);
      button.addEventListener('click', () => loadBlog(i, { openPlayer: true, restore: i === state.blog }));
      blogsList.append(button);
    });
  }

  function render() {
    list.innerHTML = '';
    episodes.forEach((ep, i) => {
      const li = document.createElement('li');
      li.dataset.i = i;
      li.tabIndex = 0;
      li.setAttribute('role', 'option');
      li.setAttribute('aria-label', ep.number + ' ' + ep.title);
      const img = Object.assign(document.createElement('img'), { src: ep.artwork || show.artwork, alt: '', loading: 'lazy' });
      const name = document.createElement('div');
      name.className = 'name';
      name.innerHTML = '<span class="num"></span>';
      name.querySelector('.num').textContent = ep.number;
      name.append(ep.title);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = '\u25B6';
      btn.setAttribute('aria-label', 'Play ' + ep.title);
      btn.addEventListener('click', (event) => {
        event.stopPropagation();
        select(i, true);
      });
      li.append(img, name, btn);
      li.addEventListener('click', () => browse(i));
      li.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowDown') { event.preventDefault(); browse(Math.min(episodes.length - 1, i + 1), true); }
        else if (event.key === 'ArrowUp') { event.preventDefault(); browse(Math.max(0, i - 1), true); }
        else if (event.key === 'Home') { event.preventDefault(); browse(0, true); }
        else if (event.key === 'End') { event.preventDefault(); browse(episodes.length - 1, true); }
      });
      list.append(li);
    });
  }

  function mark() {
    [...list.children].forEach((li, i) => {
      li.classList.toggle('active', i === state.browseIndex);
      li.classList.toggle('playing', i === state.index);
      li.setAttribute('aria-selected', String(i === state.browseIndex));
    });
    const ep = episodes[state.index];
    now.textContent = ep.number + ' ' + ep.title;
    playerTitle.textContent = show.title;
    document.title = show.title ? `${ep.title} - ${show.title}` : ep.title;
    list.children[state.browseIndex]?.scrollIntoView({ block: 'nearest' });
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: ep.title, artist: show.author || show.title, artwork: [{ src: ep.artwork || show.artwork }] });
    }
  }

  function select(i, autoplay) {
    if (i < 0 || i >= episodes.length) return;
    if (i !== state.index || !video.src) {
      rememberCurrentTime();
      state.index = i;
      state.browseIndex = i;
      const resume = state.times[episodeKey(episodes[i])] || 0;
      video.src = episodes[i].url;
      video.addEventListener('loadedmetadata', () => {
        if (resume > 0 && resume < video.duration - 2) video.currentTime = resume;
      }, { once: true });
    } else if (autoplay && video.ended) {
      video.currentTime = 0;
    }
    if (autoplay) state.browseIndex = i;
    mark();
    save();
    document.getElementById('next').disabled = state.index + 1 >= episodes.length;
    if (autoplay) video.play().catch(() => {});
  }

  function loadBlog(i, options = {}) {
    const blog = blogs[i];
    if (!blog) return;
    rememberCurrentTime();
    activeBlog = i;
    state.blog = i;
    if (!options.restore) {
      state.index = 0;
      state.browseIndex = 0;
    }
    video.pause();
    video.removeAttribute('src');
    video.load();
    Object.assign(show, { title: blog.title, description: blog.description || show.description, author: blog.author || show.author, artwork: blog.artwork || show.artwork });
    document.title = show.title;
    renderBlogs();
    return fetch(blog.episodes || 'episodes.json').then((r) => r.json()).then((data) => {
      episodes = data;
      if (!(state.index >= 0 && state.index < episodes.length)) state.index = 0;
      if (!(state.browseIndex >= 0 && state.browseIndex < episodes.length)) state.browseIndex = state.index;
      render();
      if (episodes.length) select(state.index, false);
      if (options.openPlayer) showPlayer();
    });
  }

  document.getElementById('back-to-hub').addEventListener('click', showHub);
  stage.addEventListener('click', togglePlay);
  document.getElementById('toggle').addEventListener('click', togglePlay);
  document.getElementById('back').addEventListener('click', () => skip(-10));
  document.getElementById('fwd').addEventListener('click', () => skip(10));
  document.getElementById('prev').addEventListener('click', () => {
    // Standard behaviour: restart the chapter first, go to the previous one if already near the start.
    if (video.currentTime > 3 || state.index === 0) video.currentTime = 0;
    else select(state.index - 1, !video.paused);
  });
  document.getElementById('next').addEventListener('click', () => select(state.index + 1, !video.paused));
  scrub.addEventListener('input', () => {
    scrubbing = true;
    if (video.duration) {
      video.currentTime = scrub.value / 1000 * video.duration;
      updateTime();
    }
  });
  scrub.addEventListener('change', () => { scrubbing = false; });
  video.addEventListener('play', () => { stage.classList.add('playing'); controls.classList.add('playing'); });
  video.addEventListener('pause', () => { stage.classList.remove('playing'); controls.classList.remove('playing'); });
  video.addEventListener('loadedmetadata', updateTime);
  video.addEventListener('timeupdate', () => {
    updateTime();
    const t = Date.now();
    if (t - lastSave > 2000 && !video.ended) {
      lastSave = t;
      rememberCurrentTime();
      state.view = 'player';
      state.blog = activeBlog;
      save();
    }
  });
  video.addEventListener('pause', () => {
    if (!video.ended && episodes.length) { rememberCurrentTime(); save(); }
  });
  video.addEventListener('ended', () => {
    state.times[episodeKey(episodes[state.index])] = 0;
    if (state.index + 1 < episodes.length) select(state.index + 1, true);
    else save();
  });

  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('nexttrack', () => select(state.index + 1, true));
    navigator.mediaSession.setActionHandler('previoustrack', () => select(state.index - 1, true));
    navigator.mediaSession.setActionHandler('seekbackward', () => skip(-10));
    navigator.mediaSession.setActionHandler('seekforward', () => skip(10));
  }

  Promise.all([
    fetch('site.json').then((r) => r.ok ? r.json() : {}).catch(() => ({})),
    fetch('blogs.json').then((r) => r.ok ? r.json() : []).catch(() => []),
  ]).then(([metadata, data]) => {
    applyShowMetadata(metadata);
    blogs = data.length ? data : [{ title: metadata.title || 'Video Podcast', description: metadata.description || '', artwork: metadata.artwork || 'artwork.jpg', feed: metadata.feed || 'feed.xml', episodes: 'episodes.json' }];
    renderBlogs();
    const restorePlayer = state.view === 'player';
    const blogToLoad = restorePlayer && state.blog >= 0 && state.blog < blogs.length ? state.blog : 0;
    loadBlog(blogToLoad, { restore: restorePlayer, openPlayer: restorePlayer });
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
