<!doctype html>
<html lang="en"> 
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Supply Chain Strategy</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Supply Chain">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="artwork.jpg">
<link rel="icon" href="artwork.jpg">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #000; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  #stage { position: relative; flex: 0 0 auto; height: min(34dvh, 56.25vw); min-height: 120px; background: #000; cursor: pointer; user-select: none; -webkit-user-select: none; }
  #stage video { width: 100%; height: 100%; object-fit: contain; display: block; }
  #badge { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; transition: opacity .2s; }
  #badge span { width: 56px; height: 56px; border-radius: 50%; background: rgba(0,0,0,.55); display: grid; place-items: center; font-size: 24px; padding-left: 4px; }
  #stage.playing #badge { opacity: 0; }
  #now { flex: 0 0 auto; padding: 8px 14px 0; font-size: 14px; font-weight: 600; background: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #controls { flex: 0 0 auto; background: #111; border-bottom: 1px solid #222; padding: 2px 12px 6px; }
  #seek { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #9a9a9a; font-variant-numeric: tabular-nums; }
  #seek span { flex: 0 0 auto; min-width: 38px; }
  #seek span:last-child { text-align: right; }
  #seek input { flex: 1 1 auto; min-width: 0; height: 28px; margin: 0; accent-color: #4da3ff; }
  #buttons { display: flex; align-items: center; justify-content: center; gap: 14px; }
  #buttons button { width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: #fff; display: grid; place-items: center; cursor: pointer; }
  #buttons button:active { background: rgba(255,255,255,.15); }
  #buttons button:disabled { opacity: .35; }
  #buttons svg { width: 28px; height: 28px; fill: currentColor; }
  #buttons #toggle { width: 54px; height: 54px; background: #fff; color: #000; }
  #buttons #toggle:active { background: #ddd; }
  #buttons #toggle svg { width: 30px; height: 30px; }
  #buttons #toggle .i-pause, #controls.playing #toggle .i-play { display: none; }
  #controls.playing #toggle .i-pause { display: inline; }
  #list { flex: 1 1 auto; min-height: 0; margin: 0; padding: 0; list-style: none; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; background: #0b0b0b; }
  #list li { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid #1c1c1c; }
  #list li.active { background: #162536; }
  #list img { width: 28px; height: 28px; border-radius: 5px; object-fit: cover; flex: 0 0 auto; }
  #list .name { flex: 1 1 auto; min-width: 0; font-size: 14px; line-height: 1.25; }
  #list .num { color: #8a8a8a; margin-right: 6px; }
  #list button { flex: 0 0 auto; width: 36px; height: 36px; border: 0; border-radius: 50%; background: #1f6feb; color: #fff; font-size: 14px; cursor: pointer; }
  #list li.active button { background: #2ea043; }
</style>
</head>
<body>
<div id="app">
  <div id="stage" title="Tap to play or pause">
    <video id="video" playsinline webkit-playsinline preload="metadata"></video>
    <div id="badge"><span>&#9654;</span></div>
  </div>
  <div id="now"></div>
  <div id="controls">
    <div id="seek">
      <span id="elapsed">0:00</span>
      <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
      <span id="remaining">-0:00</span>
    </div>
    <div id="buttons">
      <button id="prev" type="button" aria-label="Previous chapter"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button id="back" type="button" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.5" text-anchor="middle" font-size="7" font-weight="700">10</text></svg></button>
      <button id="toggle" type="button" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path class="i-play" d="M8 5v14l11-7z"/><path class="i-pause" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button>
      <button id="fwd" type="button" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24"><path transform="translate(24 0) scale(-1 1)" d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.5" text-anchor="middle" font-size="7" font-weight="700">10</text></svg></button>
      <button id="next" type="button" aria-label="Next chapter"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
  </div>
  <ul id="list"></ul>
</div>
<script>
(() => {
  const KEY = 'scs-player-v1';
  const video = document.getElementById('video');
  const stage = document.getElementById('stage');
  const list = document.getElementById('list');
  const now = document.getElementById('now');
  const controls = document.getElementById('controls');
  const scrub = document.getElementById('scrub');
  const elapsed = document.getElementById('elapsed');
  const remaining = document.getElementById('remaining');
  let scrubbing = false;

  const fmt = (s) => {
    s = Math.max(0, Math.floor(s || 0));
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = String(s % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
  };
  const togglePlay = () => { video.paused ? video.play().catch(() => {}) : video.pause(); };
  const skip = (delta) => {
    if (!video.duration) return;
    video.currentTime = Math.min(video.duration, Math.max(0, video.currentTime + delta));
  };
  const updateTime = () => {
    const d = video.duration || 0;
    elapsed.textContent = fmt(video.currentTime);
    remaining.textContent = '-' + fmt(d - video.currentTime);
    if (!scrubbing) scrub.value = d ? video.currentTime / d * 1000 : 0;
  };
  let episodes = [];
  let state = { index: 0, times: {} };
  let lastSave = 0;

  try { Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

  function render() {
    list.innerHTML = '';
    episodes.forEach((ep, i) => {
      const li = document.createElement('li');
      li.dataset.i = i;
      const img = Object.assign(document.createElement('img'), { src: 'artwork.jpg', alt: '', loading: 'lazy' });
      const name = document.createElement('div');
      name.className = 'name';
      name.innerHTML = '<span class="num"></span>';
      name.querySelector('.num').textContent = ep.number;
      name.append(ep.title);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = '\u25B6';
      btn.setAttribute('aria-label', 'Play ' + ep.title);
      btn.addEventListener('click', () => select(i, true));
      li.append(img, name, btn);
      list.append(li);
    });
  }

  function mark() {
    [...list.children].forEach((li, i) => li.classList.toggle('active', i === state.index));
    const ep = episodes[state.index];
    now.textContent = ep.number + ' ' + ep.title;
    document.title = ep.title;
    list.children[state.index]?.scrollIntoView({ block: 'nearest' });
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: ep.title, artist: 'Supply Chain Strategy', artwork: [{ src: 'artwork.jpg' }] });
    }
  }

  function select(i, autoplay) {
    if (i < 0 || i >= episodes.length) return;
    if (i !== state.index || !video.src) {
      if (video.src && !video.ended) state.times[episodes[state.index].file] = video.currentTime;
      state.index = i;
      const resume = state.times[episodes[i].file] || 0;
      video.src = episodes[i].url;
      video.addEventListener('loadedmetadata', () => {
        if (resume > 0 && resume < video.duration - 2) video.currentTime = resume;
      }, { once: true });
    } else if (autoplay && video.ended) {
      video.currentTime = 0;
    }
    mark();
    save();
    document.getElementById('next').disabled = state.index + 1 >= episodes.length;
    if (autoplay) video.play().catch(() => {});
  }

  stage.addEventListener('click', togglePlay);
  document.getElementById('toggle').addEventListener('click', togglePlay);
  document.getElementById('back').addEventListener('click', () => skip(-10));
  document.getElementById('fwd').addEventListener('click', () => skip(10));
  document.getElementById('prev').addEventListener('click', () => {
    // Standard behaviour: restart the chapter first, go to the previous one if already near the start.
    if (video.currentTime > 3 || state.index === 0) video.currentTime = 0;
    else select(state.index - 1, !video.paused);
  });
  document.getElementById('next').addEventListener('click', () => select(state.index + 1, !video.paused));
  scrub.addEventListener('input', () => {
    scrubbing = true;
    if (video.duration) {
      video.currentTime = scrub.value / 1000 * video.duration;
      updateTime();
    }
  });
  scrub.addEventListener('change', () => { scrubbing = false; });
  video.addEventListener('play', () => { stage.classList.add('playing'); controls.classList.add('playing'); });
  video.addEventListener('pause', () => { stage.classList.remove('playing'); controls.classList.remove('playing'); });
  video.addEventListener('loadedmetadata', updateTime);
  video.addEventListener('timeupdate', () => {
    updateTime();
    const t = Date.now();
    if (t - lastSave > 2000 && !video.ended) {
      lastSave = t;
      state.times[episodes[state.index].file] = video.currentTime;
      save();
    }
  });
  video.addEventListener('pause', () => {
    if (!video.ended && episodes.length) { state.times[episodes[state.index].file] = video.currentTime; save(); }
  });
  video.addEventListener('ended', () => {
    state.times[episodes[state.index].file] = 0;
    if (state.index + 1 < episodes.length) select(state.index + 1, true);
    else save();
  });

  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('nexttrack', () => select(state.index + 1, true));
    navigator.mediaSession.setActionHandler('previoustrack', () => select(state.index - 1, true));
    navigator.mediaSession.setActionHandler('seekbackward', () => skip(-10));
    navigator.mediaSession.setActionHandler('seekforward', () => skip(10));
  }

  fetch('episodes.json').then((r) => r.json()).then((data) => {
    episodes = data;
    if (!episodes.length) return;
    if (!(state.index >= 0 && state.index < episodes.length)) state.index = 0;
    render();
    select(state.index, false);
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
