name: Publish podcast feed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install thumbnail tooling
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Load private podcast configuration
        env:
          PODCAST_CONFIG_JSON: ${{ secrets.PODCAST_CONFIG_JSON }}
        run: |
          if [ -z "$PODCAST_CONFIG_JSON" ]; then
            echo "::error::Set the PODCAST_CONFIG_JSON Actions secret to the podcast configuration JSON."
            exit 1
          fi
          printf '%s' "$PODCAST_CONFIG_JSON" > "$RUNNER_TEMP/podcast.json"
          node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" "$RUNNER_TEMP/podcast.json"
          echo "PODCAST_CONFIG=$RUNNER_TEMP/podcast.json" >> "$GITHUB_ENV"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Generate podcast feed
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/generate-feed.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4