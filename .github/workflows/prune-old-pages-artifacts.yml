name: Remove obsolete Pages artifacts

on:
  push:
    branches: [main]

permissions:
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts from prior deployments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          artifacts=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"github-pages\" and .workflow_run.head_sha != \"${GITHUB_SHA}\") | .id")
          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            gh api --silent --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            echo "Removed stale Pages artifact ${artifact_id}"
          done <<< "$artifacts"
